  services:
    postgres:
      image: postgres:17
      container_name: hoko-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: hoko
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - hoko-postgres-data:/var/lib/postgresql/data

  volumes:
    hoko-postgres-data: