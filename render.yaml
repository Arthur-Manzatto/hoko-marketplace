services:
  - type: web
    name: hoko-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /api/categories
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_HOST
        value: aws-0-sa-east-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.ufdgevqpgowaaxblrnwf
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false