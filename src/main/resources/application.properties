spring.application.name=hoko-api
spring.profiles.active=dev
server.port=${PORT:8080}
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

# Banco: Supabase (fonte unica do schema, alteracoes via Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Auth: JWT emitido pelo Supabase Auth (chaves assimetricas ES256 via JWKS)
hoko.supabase-url=${SUPABASE_URL:https://ufdgevqpgowaaxblrnwf.supabase.co}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${hoko.supabase-url}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${hoko.supabase-url}/auth/v1
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
