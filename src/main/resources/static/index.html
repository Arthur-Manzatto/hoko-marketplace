<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/style.css" type="text/css">

    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">

    <title>Hoko</title>
</head>

<body>

    <!--Menu Navegação-->
    <nav class="navbar fixed-top">
        <div class="container d-flex align-items-center justify-content-between text-dark">
            <div class="d-flex align-items-center">
                <button class="btn sidebar-toggle mr-2" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <a href="#" class="nav-brand">
                    <img src="/img/logo.svg" alt="" class="img-fluid logo">
                </a>
            </div>
            <div class="d-none d-lg-flex flex-grow-1 mx-4" style="max-width: 500px;">
                <div class="input-group input-custom">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                    </div>

                    <input type="text" class="form-control" placeholder="Buscar produtos...">

                </div>
                <button class="btn btn-custom ml-2">
                    Buscar
                </button>
            </div>
            <div class="d-flex align-items-center">
                <button class="btn car-custom d-lg-none mr-1" type="button" data-toggle="collapse"
                    data-target="#searchMobile">
                    <i class="bi bi-search"></i>
                </button>
                <a href="#" class="btn car-custom mr-3">
                    <i class="bi bi-cart2"></i>
                </a>

                <a href="/login.html" class="btn login-custom" id="loginLink">
                    <i class="bi bi-person mr-1"></i>Entrar
                </a>

                <div class="profile-wrap" id="profileWrap" hidden>
                    <button class="profile-button" id="profileButton" type="button"
                            aria-haspopup="menu" aria-expanded="false"
                            aria-label="Menu do perfil">
                        <span class="profile-initial" id="profileInitial" aria-hidden="true"></span>
                    </button>

                    <div class="profile-menu" id="profileMenu" role="menu" hidden>
                        <div class="profile-menu-header">
                            <span class="profile-menu-name" id="userName"></span>
                        </div>
                        <button class="profile-menu-item" id="profileLink" type="button" role="menuitem">
                            <i class="bi bi-person"></i> Perfil
                        </button>
                        <div class="profile-menu-divider"></div>
                        <button class="profile-menu-item profile-menu-item--danger" id="logoutButton" type="button" role="menuitem">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!--colappsado-->
        <div class="collapse w-100 d-lg-none px-3 pb-2 mt-2 " id="searchMobile">
            <div class="d-flex">
                <div class="input-group input-custom">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                    </div>
                    <input type="text" class="form-control" placeholder="Buscar produtos...">
                </div>
                <button class="btn btn-custom ml-2">Buscar</button>
            </div>
        </div>
    </nav>

    <!--Menu Lateral-->

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex align-items-center justify-content-between">
            <a href="#" class="nav-brand">
                <img src="/img/logo.svg" alt="" class="img-fluid logo">
            </a>
            <button class="btn p-0" id="sidebarClose">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

    </div>

    <section id="home" class="py-5">
        <div class="container">
            <div class="row align-items-center ">
                <div class="col-md-6">
                    <div class="custom-home">
                        <h1>Tudo o que você procura, <br> <span style="color: #013095;">perto de você</span></h1>
                        <p>Milhares de produtos em um só lugar. <br> Compre com segurança!!!</p>
                    </div>

                </div>
                <div class="col-md-6 ">
                    <div class="img-home  ">
                        <img src="/img/home1.png" alt="" class="w-100 h-100  ">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="categoria">

    </section>




















    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/sidebar.js"></script>
    <script type="module" src="/js/session.js"></script>

</body>

</html>
