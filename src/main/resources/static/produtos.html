<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/style.css" type="text/css">
   


    <title>Produto | Hoko</title>
</head>

<body>

    <!--Menu Navegação-->
    <nav class="navbar fixed-top">
        <div class="container d-flex align-items-center justify-content-between text-dark">
            <div class="d-flex align-items-center">
                <button class="btn sidebar-toggle mr-2" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <a href="index.html" class="nav-brand">
                    <img src="/img/logo.svg" alt="" class="img-fluid logo">
                </a>
            </div>
            <div class="d-none d-lg-flex flex-grow-1 mx-4" style="max-width: 500px;">
                <div class="input-group input-custom">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                    </div>

                    <input type="text" class="form-control" placeholder="Buscar produtos...">

                </div>
                <button class="btn btn-custom ml-2">
                    Buscar
                </button>
            </div>
            <div class="d-flex align-items-center">
                <button class="btn car-custom d-lg-none mr-1" type="button" data-toggle="collapse"
                    data-target="#searchMobile">
                    <i class="bi bi-search"></i>
                </button>
                <a href="#" class="btn car-custom mr-3">
                    <i class="bi bi-cart2"></i>
                </a>

                <a href="/login.html" class="btn login-custom" id="loginLink" data-auth="pending">
                    <i class="bi bi-person mr-1"></i>Entrar
                </a>

                <div class="profile-wrap" id="profileWrap" hidden>
                    <button class="profile-button" id="profileButton" type="button"
                            aria-haspopup="menu" aria-expanded="false"
                            aria-label="Menu do perfil">
                        <span class="profile-initial" id="profileInitial" aria-hidden="true"></span>
                    </button>

                    <div class="profile-menu" id="profileMenu" role="menu" hidden>
                        <div class="profile-menu-header">
                            <span class="profile-menu-name" id="userName"></span>
                        </div>
                        <button class="profile-menu-item" id="profileLink" type="button" role="menuitem">
                            <i class="bi bi-person"></i> Perfil
                        </button>
                        <div class="profile-menu-divider"></div>
                        <button class="profile-menu-item profile-menu-item--danger" id="logoutButton" type="button" role="menuitem">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!--colappsado-->
        <div class="collapse w-100 d-lg-none px-3 pb-2 mt-2 " id="searchMobile">
            <div class="d-flex">
                <div class="input-group input-custom">
                    <div class="input-group-prepend">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                    </div>
                    <input type="text" class="form-control" placeholder="Buscar produtos...">
                </div>
                <button class="btn btn-custom ml-2">Buscar</button>
            </div>
        </div>
    </nav>

    <!--Menu Lateral-->

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex align-items-center justify-content-between">
            <a href="#" class="nav-brand">
                <img src="/img/logo.svg" alt="" class="img-fluid logo">
            </a>
            <button class="btn p-0" id="sidebarClose">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

    </div>

 
    <section class="container produto-pagina">
        <!-- Skeleton já no HTML: aparece na hora, antes do JS e da API. Mesma grade do conteúdo real. -->
        <div id="product_skeleton" aria-busy="true">
            <div class="produto-caminho" aria-hidden="true">
                <span class="skeleton skeleton-text produto-sk-caminho"></span>
            </div>
            <div class="produto-detalhe" aria-hidden="true">
                <div class="row">
                    <div class="col-12 col-lg-6 mb-4 mb-lg-0">
                        <div class="produto-foto skeleton"></div>
                    </div>
                    <div class="produto-resumo col-12 col-lg-6">
                        <span class="skeleton skeleton-text w-25"></span>
                        <span class="skeleton skeleton-title produto-sk-titulo"></span>
                        <span class="skeleton skeleton-text w-50"></span>
                        <span class="skeleton produto-sk-preco"></span>
                        <span class="skeleton skeleton-text w-50"></span>
                        <span class="skeleton produto-sk-bloco"></span>
                        <span class="skeleton skeleton-text w-75"></span>
                        <div class="row produto-sk-botoes">
                            <div class="col-12 col-sm-6 mb-2 mb-sm-0"><span class="skeleton skeleton-btn"></span></div>
                            <div class="col-12 col-sm-6"><span class="skeleton skeleton-btn"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="product_view" hidden>
        <nav class="produto-caminho d-flex flex-wrap align-items-center" aria-label="Caminho de navegação">
            <a href="index.html">Início</a><span aria-hidden="true">/</span>
            <a href="#" id="product_cat_path"></a><span aria-hidden="true">/</span>
            <span aria-current="page" id="product_name_path"></span>
        </nav>

        <div class="produto-detalhe" aria-labelledby="product_title">
            <div class="row">
            <div class="col-12 col-lg-6 mb-4 mb-lg-0 d-flex flex-column">
            <div class="produto-foto d-flex align-items-center justify-content-center flex-grow-1">

                <img id="product_img" class="produto-foto-img" alt="">

                <div class="produto-foto-placeholder d-flex flex-column align-items-center">
                    <i class="bi bi-image" aria-hidden="true"></i>
                    <span>Imagem do produto</span>
                </div>
                <button class="produto-favorito btn" type="button" aria-label="Favoritar produto" aria-pressed="false">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                </button>
            </div>
            <div class="produto-miniaturas d-flex flex-wrap" id="product_thumbs" aria-label="Fotos do produto"></div>

            </div>
            <div class="produto-resumo col-12 col-lg-6">
                <p class="produto-condicao">Novo</p>
                <h1 id="product_title"></h1>

                <div class="produto-valor">
                    <p class="produto-preco-atual" id="product_curprice"></p>
                    <p class="produto-parcelas" id="product_installments"></p>
                </div>

                <section class="produto-entrega" aria-label="Entrega">
                    <div class="produto-frete d-flex align-items-start">
                        <i class="bi bi-truck" aria-hidden="true"></i>
                        <div>
                            <p>Frete grátis para todo o Brasil</p>
                            <span>Envio rápido com rastreamento</span>
                        </div>
                    </div>
                    <form class="produto-cep d-flex" id="produto-cep-form">
                        <label class="sr-only" for="produto-cep">CEP de entrega</label>
                        <input class="form-control" id="produto-cep" name="cep" type="text" inputmode="numeric"
                            autocomplete="postal-code" maxlength="9" pattern="[0-9]{5}-?[0-9]{3}"
                            placeholder="Digite seu CEP" required>
                        <button class="btn produto-calcular" type="submit">Calcular</button>
                    </form>
                    <p class="produto-retorno" id="produto-cep-retorno" role="status"></p>
                </section>

                <div class="produto-disponibilidade d-flex flex-wrap align-items-center justify-content-between">
                    <div>
                        <p class="produto-estoque" id="product_stock">Estoque disponível</p>
                        <p class="produto-unidades" id="product_units"></p>
                    </div>
                    <div class="produto-quantidade d-flex align-items-center">
                        <label for="product_qty">Quantidade</label>
                        <!-- opções montadas pelo product.js conforme o estoque (até 10) -->
                        <select class="custom-select" id="product_qty" name="quantidade"></select>
                    </div>
                </div>

                <!-- Botões de demonstração: conectar ao carrinho e checkout do projeto. -->
                <div class="produto-acoes row">
                    <div class="col-12 col-sm-6 mb-2 mb-sm-0">
                        <button class="btn btn-block produto-botao produto-carrinho" type="button">Adicionar ao carrinho</button>
                    </div>
                    <div class="col-12 col-sm-6">
                        <button class="btn btn-block produto-botao produto-comprar" type="button">Comprar agora</button>
                    </div>
                </div>
                <p class="produto-retorno" id="produto-compra-retorno" role="status"></p>

                <div class="produto-loja d-flex align-items-center">
                    <span class="produto-loja-icone d-inline-flex align-items-center justify-content-center flex-shrink-0"><i class="bi bi-shop" aria-hidden="true"></i></span>
                    <span class="produto-loja-nome" id="product_store"></span>
                </div>
            </div>
            </div>
        </div>

        <section class="produto-descricao" aria-labelledby="product_desc_title">
            <h2 id="product_desc_title">Descrição</h2>
            <p id="product_description"></p>
        </section>
        </div>
    </section>





















    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/sidebar.js"></script>

    <script type="module" src="/js/session.js"></script>
    <script type="module" src="/js/product.js"></script>


</body>

</html>
